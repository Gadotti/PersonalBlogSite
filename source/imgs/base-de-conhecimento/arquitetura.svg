<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 345" role="img" aria-label="O sistema de chamados é só lido; o texto passa pelas camadas bruto, limpo e pronto no PostgreSQL; só o texto do pronto vai à API de embedding, e a IA lê só o pronto.">
  <title>Arquitetura da base de conhecimento</title>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="seta-destaque" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0085A1"/>
    </marker>
  </defs>
  <rect width="760" height="345" fill="#ffffff"/>
  <g font-family="'Open Sans','Helvetica Neue',Helvetica,Arial,sans-serif" fill="#333" text-anchor="middle">

    <!-- origem -->
    <rect x="10" y="150" width="105" height="100" rx="6" fill="#ffffff" stroke="#888"/>
    <text x="62.5" y="180" font-size="13" font-weight="700">Sistema de</text>
    <text x="62.5" y="196" font-size="13" font-weight="700">chamados</text>
    <text x="62.5" y="218" font-size="11.5">SQL Server</text>
    <text x="62.5" y="234" font-size="11.5">login só leitura</text>

    <!-- container PostgreSQL -->
    <rect x="145" y="100" width="480" height="235" rx="8" fill="#f7f7f7" stroke="#bbb" stroke-dasharray="5 4"/>
    <text x="160" y="122" font-size="12.5" font-weight="700" fill="#555" text-anchor="start">PostgreSQL 18 + pgvector + unaccent</text>

    <!-- bruto -->
    <rect x="165" y="150" width="110" height="100" rx="6" fill="#ffffff" stroke="#888"/>
    <text x="220" y="176" font-size="14" font-weight="700">bruto</text>
    <text x="220" y="196" font-size="11.5">sem segredo</text>
    <text x="220" y="212" font-size="11.5">com dado pessoal</text>
    <text x="220" y="236" font-size="11" fill="#777">acesso: job e DBA</text>

    <!-- limpo -->
    <rect x="325" y="150" width="110" height="100" rx="6" fill="#ffffff" stroke="#888"/>
    <text x="380" y="176" font-size="14" font-weight="700">limpo</text>
    <text x="380" y="196" font-size="11.5">marcadores</text>
    <text x="380" y="212" font-size="11.5">motivos e faixa</text>
    <text x="380" y="236" font-size="11" fill="#777">acesso: equipe</text>

    <!-- pronto -->
    <rect x="485" y="150" width="120" height="100" rx="6" fill="#ffffff" stroke="#0085A1" stroke-width="2"/>
    <text x="545" y="176" font-size="14" font-weight="700" fill="#0085A1">pronto</text>
    <text x="545" y="196" font-size="11.5">fio + tsvector</text>
    <text x="545" y="212" font-size="11.5">trechos + vetor</text>
    <text x="545" y="236" font-size="11" fill="#777">acesso: só a IA</text>

    <!-- controle -->
    <rect x="165" y="275" width="440" height="44" rx="6" fill="#ffffff" stroke="#888"/>
    <text x="385" y="293" font-size="12.5" font-weight="700">controle</text>
    <text x="385" y="310" font-size="11">marca d'água, execuções, histórico só com hash, catálogo de modelos</text>

    <!-- fluxo principal -->
    <line x1="115" y1="200" x2="163" y2="200" stroke="#555" stroke-width="1.5" marker-end="url(#seta)"/>
    <text x="139" y="192" font-size="11">extrair</text>
    <line x1="275" y1="200" x2="323" y2="200" stroke="#555" stroke-width="1.5" marker-end="url(#seta)"/>
    <text x="300" y="192" font-size="11">limpar</text>
    <line x1="435" y1="200" x2="483" y2="200" stroke="#555" stroke-width="1.5" marker-end="url(#seta)"/>
    <text x="460" y="192" font-size="11">indexar</text>

    <!-- IA -->
    <rect x="660" y="150" width="95" height="100" rx="6" fill="#ffffff" stroke="#888"/>
    <text x="707.5" y="184" font-size="13" font-weight="700">IA de</text>
    <text x="707.5" y="200" font-size="13" font-weight="700">atendimento</text>
    <text x="707.5" y="222" font-size="11.5">lê só o</text>
    <text x="707.5" y="238" font-size="11.5">pronto</text>
    <line x1="605" y1="200" x2="658" y2="200" stroke="#555" stroke-width="1.5" marker-end="url(#seta)"/>
    <text x="632" y="192" font-size="11">busca</text>

    <!-- API externa -->
    <rect x="625" y="8" width="130" height="86" rx="6" fill="#ffffff" stroke="#0085A1" stroke-dasharray="5 4"/>
    <rect x="640" y="16" width="100" height="48" rx="6" fill="#ffffff" stroke="#0085A1" stroke-width="2"/>
    <text x="690" y="36" font-size="12.5" font-weight="700">API de</text>
    <text x="690" y="52" font-size="12.5" font-weight="700">embedding</text>
    <text x="690" y="84" font-size="11" fill="#0085A1" font-style="italic">fora da empresa</text>

    <polyline points="530,150 530,32 638,32" fill="none" stroke="#0085A1" stroke-width="1.5" marker-end="url(#seta-destaque)"/>
    <text x="617" y="26" font-size="10.5" fill="#0085A1" text-anchor="end">só texto do pronto</text>
    <polyline points="638,50 560,50 560,148" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#seta)"/>
    <text x="598" y="66" font-size="10.5">vetores</text>
  </g>
</svg>
