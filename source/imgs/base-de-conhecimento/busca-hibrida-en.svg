<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 610" role="img" aria-label="The production search: the question is cleaned with the same rules as the knowledge base and goes down two paths, by keyword through the GIN index and by meaning through the HNSW index, each returning 50 results; the two lists are merged with RRF and the top 5 go to the support agent.">
  <title>The production hybrid search</title>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="760" height="610" fill="#ffffff"/>
  <g font-family="'Open Sans','Helvetica Neue',Helvetica,Arial,sans-serif" fill="#333" text-anchor="middle">

    <rect x="230" y="15" width="300" height="50" rx="6" fill="#ffffff" stroke="#888"/>
    <text x="380" y="37" font-size="13" font-weight="700">New ticket</text>
    <text x="380" y="55" font-size="11.5">title + description</text>
    <line x1="380" y1="65" x2="380" y2="93" stroke="#555" stroke-width="1.5" marker-end="url(#seta)"/>

    <rect x="230" y="95" width="300" height="50" rx="6" fill="#ffffff" stroke="#888"/>
    <text x="380" y="117" font-size="13" font-weight="700">Same cleaning as the base (R2 to R9)</text>
    <text x="380" y="135" font-size="11.5">secrets and personal data out before search</text>

    <polyline points="380,145 380,160 195,160 195,193" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#seta)"/>
    <polyline points="380,160 565,160 565,193" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#seta)"/>

    <!-- keyword column -->
    <text x="205" y="182" font-size="12" font-weight="700" fill="#555" text-anchor="start">by keyword (full-text)</text>
    <rect x="40" y="195" width="310" height="54" rx="6" fill="#ffffff" stroke="#888"/>
    <text x="195" y="218" font-size="12.5" font-weight="700">rarest stems in the question</text>
    <text x="195" y="237" font-size="11.5">up to 2,000 tickets in total (pronto.radical)</text>
    <line x1="195" y1="249" x2="195" y2="277" stroke="#555" stroke-width="1.5" marker-end="url(#seta)"/>
    <rect x="40" y="279" width="310" height="54" rx="6" fill="#ffffff" stroke="#888"/>
    <text x="195" y="302" font-size="12.5" font-weight="700">candidates via the GIN index</text>
    <text x="195" y="321" font-size="11.5">ranked by ts_rank of the whole question</text>
    <line x1="195" y1="333" x2="195" y2="361" stroke="#555" stroke-width="1.5" marker-end="url(#seta)"/>
    <rect x="40" y="363" width="310" height="54" rx="6" fill="#ffffff" stroke="#888"/>
    <text x="195" y="386" font-size="12.5" font-weight="700">top 50 tickets</text>
    <text x="195" y="405" font-size="11.5">~0.4 s on the full history</text>

    <!-- vector column -->
    <text x="575" y="182" font-size="12" font-weight="700" fill="#555" text-anchor="start">by meaning (pgvector)</text>
    <rect x="410" y="195" width="310" height="54" rx="6" fill="#ffffff" stroke="#0085A1" stroke-width="2"/>
    <text x="565" y="218" font-size="12.5" font-weight="700">Embedding API</text>
    <text x="565" y="237" font-size="11.5" fill="#0085A1">only the clean question goes out; 1,024 dims back</text>
    <line x1="565" y1="249" x2="565" y2="277" stroke="#555" stroke-width="1.5" marker-end="url(#seta)"/>
    <rect x="410" y="279" width="310" height="54" rx="6" fill="#ffffff" stroke="#888"/>
    <text x="565" y="302" font-size="12.5" font-weight="700">HNSW index: 500 nearest chunks</text>
    <text x="565" y="321" font-size="11.5">ef_search 100, iterative scan</text>
    <line x1="565" y1="333" x2="565" y2="361" stroke="#555" stroke-width="1.5" marker-end="url(#seta)"/>
    <rect x="410" y="363" width="310" height="54" rx="6" fill="#ffffff" stroke="#888"/>
    <text x="565" y="386" font-size="12.5" font-weight="700">top 50 tickets</text>
    <text x="565" y="405" font-size="11.5">each one by its nearest chunk</text>

    <!-- fusion -->
    <polyline points="195,417 195,437 360,437 360,455" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#seta)"/>
    <polyline points="565,417 565,437 400,437 400,455" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#seta)"/>
    <rect x="200" y="457" width="360" height="54" rx="6" fill="#ffffff" stroke="#0085A1" stroke-width="2"/>
    <text x="380" y="480" font-size="12.5" font-weight="700" fill="#0085A1">RRF: sum of 1 / (60 + rank)</text>
    <text x="380" y="499" font-size="11.5">whatever ranks well on both lists rises</text>
    <line x1="380" y1="511" x2="380" y2="539" stroke="#555" stroke-width="1.5" marker-end="url(#seta)"/>

    <rect x="200" y="541" width="360" height="54" rx="6" fill="#ffffff" stroke="#888"/>
    <text x="380" y="564" font-size="12.5" font-weight="700">5 suggestions to the support agent</text>
    <text x="380" y="583" font-size="11.5">tier, recorded solution and nearest chunk</text>
  </g>
</svg>
