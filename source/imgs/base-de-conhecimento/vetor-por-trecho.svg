<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-label="À esquerda, um vetor só para um chamado longo fica na média dos assuntos e longe da pergunta curta. À direita, o chamado é cortado em trechos com o título na frente, e vale pelo trecho mais próximo da pergunta.">
  <title>Um vetor por chamado contra um vetor por trecho</title>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="760" height="290" fill="#ffffff"/>
  <g font-family="'Open Sans','Helvetica Neue',Helvetica,Arial,sans-serif" fill="#333" text-anchor="middle">

    <line x1="380" y1="10" x2="380" y2="280" stroke="#ddd"/>

    <!-- ESQUERDA -->
    <text x="192" y="26" font-size="13" font-weight="700">Antes: 1 vetor por chamado</text>

    <rect x="20" y="45" width="110" height="190" rx="4" fill="#ffffff" stroke="#888"/>
    <rect x="21" y="46" width="108" height="62" fill="#eef6f8"/>
    <rect x="21" y="108" width="108" height="63" fill="#f6f6f6"/>
    <rect x="21" y="171" width="108" height="63" fill="#eef6f8"/>
    <text x="75" y="81" font-size="11.5">assunto 1</text>
    <text x="75" y="144" font-size="11.5">assunto 2</text>
    <text x="75" y="207" font-size="11.5">assunto 3</text>
    <text x="75" y="252" font-size="11" fill="#777">chamado longo</text>

    <line x1="130" y1="140" x2="181" y2="140" stroke="#555" stroke-width="1.5" marker-end="url(#seta)"/>
    <text x="156" y="132" font-size="10.5">1 vetor</text>

    <rect x="185" y="45" width="180" height="190" rx="4" fill="#fafafa" stroke="#ddd"/>
    <text x="355" y="228" font-size="10" fill="#999" text-anchor="end">espaço dos vetores</text>
    <line x1="250" y1="150" x2="330" y2="72" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="304" y="124" font-size="11" fill="#666">longe</text>
    <circle cx="250" cy="150" r="6" fill="#555"/>
    <text x="250" y="172" font-size="11">média dos 3</text>
    <circle cx="330" cy="72" r="6" fill="#0085A1"/>
    <text x="330" y="60" font-size="11" fill="#0085A1" font-weight="700">pergunta</text>

    <text x="192" y="275" font-size="12">a pergunta curta fica longe da média dos assuntos</text>

    <!-- DIREITA -->
    <text x="567" y="26" font-size="13" font-weight="700">Depois: 1 vetor por trecho</text>

    <rect x="395" y="45" width="110" height="58" rx="4" fill="#eef6f8" stroke="#888"/>
    <rect x="395" y="111" width="110" height="58" rx="4" fill="#f6f6f6" stroke="#888"/>
    <rect x="395" y="177" width="110" height="58" rx="4" fill="#eef6f8" stroke="#888"/>
    <text x="450" y="68" font-size="10.5" fill="#777">título +</text>
    <text x="450" y="86" font-size="11.5">assunto 1</text>
    <text x="450" y="134" font-size="10.5" fill="#777">título +</text>
    <text x="450" y="152" font-size="11.5">assunto 2</text>
    <text x="450" y="200" font-size="10.5" fill="#777">título +</text>
    <text x="450" y="218" font-size="11.5">assunto 3</text>
    <text x="450" y="252" font-size="11" fill="#777">até 1.000 caracteres</text>

    <line x1="505" y1="140" x2="556" y2="140" stroke="#555" stroke-width="1.5" marker-end="url(#seta)"/>
    <text x="531" y="132" font-size="10.5">3 vetores</text>

    <rect x="560" y="45" width="180" height="190" rx="4" fill="#fafafa" stroke="#ddd"/>
    <text x="730" y="228" font-size="10" fill="#999" text-anchor="end">espaço dos vetores</text>
    <circle cx="595" cy="190" r="6" fill="#555"/>
    <text x="595" y="212" font-size="10.5">trecho 1</text>
    <circle cx="625" cy="125" r="6" fill="#555"/>
    <text x="625" y="147" font-size="10.5">trecho 3</text>
    <line x1="690" y1="92" x2="712" y2="68" stroke="#0085A1" stroke-width="2"/>
    <circle cx="690" cy="92" r="6" fill="#555"/>
    <text x="690" y="114" font-size="10.5">trecho 2</text>
    <circle cx="712" cy="68" r="6" fill="#0085A1"/>
    <text x="712" y="56" font-size="11" fill="#0085A1" font-weight="700">pergunta</text>
    <text x="668" y="72" font-size="11" fill="#0085A1" text-anchor="end">perto</text>

    <text x="567" y="275" font-size="12">o chamado vale pelo trecho mais próximo da pergunta</text>
  </g>
</svg>
