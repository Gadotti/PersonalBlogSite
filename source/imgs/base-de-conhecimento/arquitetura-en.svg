<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 345" role="img" aria-label="The ticketing system is only read; the text flows through the bruto (raw), limpo (clean) and pronto (ready) layers in PostgreSQL; only text from pronto goes to the embedding API, and the AI reads only pronto.">
  <title>Knowledge base architecture</title>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="seta-destaque" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0085A1"/>
    </marker>
  </defs>
  <rect width="760" height="345" fill="#ffffff"/>
  <g font-family="'Open Sans','Helvetica Neue',Helvetica,Arial,sans-serif" fill="#333" text-anchor="middle">

    <!-- source -->
    <rect x="10" y="150" width="105" height="100" rx="6" fill="#ffffff" stroke="#888"/>
    <text x="62.5" y="180" font-size="13" font-weight="700">Ticketing</text>
    <text x="62.5" y="196" font-size="13" font-weight="700">system</text>
    <text x="62.5" y="218" font-size="11.5">SQL Server</text>
    <text x="62.5" y="234" font-size="11.5">read-only login</text>

    <!-- PostgreSQL container -->
    <rect x="145" y="100" width="480" height="235" rx="8" fill="#f7f7f7" stroke="#bbb" stroke-dasharray="5 4"/>
    <text x="160" y="122" font-size="12.5" font-weight="700" fill="#555" text-anchor="start">PostgreSQL 18 + pgvector + unaccent</text>

    <!-- bruto -->
    <rect x="165" y="150" width="110" height="100" rx="6" fill="#ffffff" stroke="#888"/>
    <text x="220" y="176" font-size="14" font-weight="700">bruto <tspan font-size="11" font-weight="400" fill="#777">(raw)</tspan></text>
    <text x="220" y="196" font-size="11.5">no secrets</text>
    <text x="220" y="212" font-size="11.5">has personal data</text>
    <text x="220" y="236" font-size="11" fill="#777">access: job, DBA</text>

    <!-- limpo -->
    <rect x="325" y="150" width="110" height="100" rx="6" fill="#ffffff" stroke="#888"/>
    <text x="380" y="176" font-size="14" font-weight="700">limpo <tspan font-size="11" font-weight="400" fill="#777">(clean)</tspan></text>
    <text x="380" y="196" font-size="11.5">placeholders</text>
    <text x="380" y="212" font-size="11.5">reasons and tier</text>
    <text x="380" y="236" font-size="11" fill="#777">access: team</text>

    <!-- pronto -->
    <rect x="485" y="150" width="120" height="100" rx="6" fill="#ffffff" stroke="#0085A1" stroke-width="2"/>
    <text x="545" y="176" font-size="14" font-weight="700" fill="#0085A1">pronto <tspan font-size="11" font-weight="400" fill="#777">(ready)</tspan></text>
    <text x="545" y="196" font-size="11.5">fio + tsvector</text>
    <text x="545" y="212" font-size="11.5">chunks + vectors</text>
    <text x="545" y="236" font-size="11" fill="#777">access: AI only</text>

    <!-- controle -->
    <rect x="165" y="275" width="440" height="44" rx="6" fill="#ffffff" stroke="#888"/>
    <text x="385" y="293" font-size="12.5" font-weight="700">controle <tspan font-size="11" font-weight="400" fill="#777">(control)</tspan></text>
    <text x="385" y="310" font-size="11">high-water mark, runs, hash-only history, template catalog</text>

    <!-- main flow -->
    <line x1="115" y1="200" x2="163" y2="200" stroke="#555" stroke-width="1.5" marker-end="url(#seta)"/>
    <text x="139" y="192" font-size="11">extract</text>
    <line x1="275" y1="200" x2="323" y2="200" stroke="#555" stroke-width="1.5" marker-end="url(#seta)"/>
    <text x="300" y="192" font-size="11">clean</text>
    <line x1="435" y1="200" x2="483" y2="200" stroke="#555" stroke-width="1.5" marker-end="url(#seta)"/>
    <text x="460" y="192" font-size="11">index</text>

    <!-- AI -->
    <rect x="660" y="150" width="95" height="100" rx="6" fill="#ffffff" stroke="#888"/>
    <text x="707.5" y="184" font-size="13" font-weight="700">Support</text>
    <text x="707.5" y="200" font-size="13" font-weight="700">AI</text>
    <text x="707.5" y="222" font-size="11.5">reads only</text>
    <text x="707.5" y="238" font-size="11.5">pronto</text>
    <line x1="605" y1="200" x2="658" y2="200" stroke="#555" stroke-width="1.5" marker-end="url(#seta)"/>
    <text x="632" y="192" font-size="11">search</text>

    <!-- external API -->
    <rect x="625" y="8" width="130" height="86" rx="6" fill="#ffffff" stroke="#0085A1" stroke-dasharray="5 4"/>
    <rect x="640" y="16" width="100" height="48" rx="6" fill="#ffffff" stroke="#0085A1" stroke-width="2"/>
    <text x="690" y="36" font-size="12.5" font-weight="700">Embedding</text>
    <text x="690" y="52" font-size="12.5" font-weight="700">API</text>
    <text x="690" y="84" font-size="11" fill="#0085A1" font-style="italic">outside the company</text>

    <polyline points="530,150 530,32 638,32" fill="none" stroke="#0085A1" stroke-width="1.5" marker-end="url(#seta-destaque)"/>
    <text x="617" y="26" font-size="10.5" fill="#0085A1" text-anchor="end">pronto text only</text>
    <polyline points="638,50 560,50 560,148" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#seta)"/>
    <text x="598" y="66" font-size="10.5">vectors</text>
  </g>
</svg>
