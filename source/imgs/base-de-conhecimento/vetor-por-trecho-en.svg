<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-label="On the left, a single vector for a long ticket lands on the average of its subjects, far from the short question. On the right, the ticket is cut into chunks with the title in front, and it counts by the chunk closest to the question.">
  <title>One vector per ticket vs. one vector per chunk</title>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="760" height="290" fill="#ffffff"/>
  <g font-family="'Open Sans','Helvetica Neue',Helvetica,Arial,sans-serif" fill="#333" text-anchor="middle">

    <line x1="380" y1="10" x2="380" y2="280" stroke="#ddd"/>

    <!-- LEFT -->
    <text x="192" y="26" font-size="13" font-weight="700">Before: 1 vector per ticket</text>

    <rect x="20" y="45" width="110" height="190" rx="4" fill="#ffffff" stroke="#888"/>
    <rect x="21" y="46" width="108" height="62" fill="#eef6f8"/>
    <rect x="21" y="108" width="108" height="63" fill="#f6f6f6"/>
    <rect x="21" y="171" width="108" height="63" fill="#eef6f8"/>
    <text x="75" y="81" font-size="11.5">subject 1</text>
    <text x="75" y="144" font-size="11.5">subject 2</text>
    <text x="75" y="207" font-size="11.5">subject 3</text>
    <text x="75" y="252" font-size="11" fill="#777">long ticket</text>

    <line x1="130" y1="140" x2="181" y2="140" stroke="#555" stroke-width="1.5" marker-end="url(#seta)"/>
    <text x="156" y="132" font-size="10.5">1 vector</text>

    <rect x="185" y="45" width="180" height="190" rx="4" fill="#fafafa" stroke="#ddd"/>
    <text x="355" y="228" font-size="10" fill="#999" text-anchor="end">vector space</text>
    <line x1="250" y1="150" x2="330" y2="72" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="304" y="124" font-size="11" fill="#666">far</text>
    <circle cx="250" cy="150" r="6" fill="#555"/>
    <text x="250" y="172" font-size="11">average of the 3</text>
    <circle cx="330" cy="72" r="6" fill="#0085A1"/>
    <text x="330" y="60" font-size="11" fill="#0085A1" font-weight="700">question</text>

    <text x="192" y="275" font-size="12">the short question is far from the subjects' average</text>

    <!-- RIGHT -->
    <text x="567" y="26" font-size="13" font-weight="700">After: 1 vector per chunk</text>

    <rect x="395" y="45" width="110" height="58" rx="4" fill="#eef6f8" stroke="#888"/>
    <rect x="395" y="111" width="110" height="58" rx="4" fill="#f6f6f6" stroke="#888"/>
    <rect x="395" y="177" width="110" height="58" rx="4" fill="#eef6f8" stroke="#888"/>
    <text x="450" y="68" font-size="10.5" fill="#777">title +</text>
    <text x="450" y="86" font-size="11.5">subject 1</text>
    <text x="450" y="134" font-size="10.5" fill="#777">title +</text>
    <text x="450" y="152" font-size="11.5">subject 2</text>
    <text x="450" y="200" font-size="10.5" fill="#777">title +</text>
    <text x="450" y="218" font-size="11.5">subject 3</text>
    <text x="450" y="252" font-size="11" fill="#777">up to 1,000 characters</text>

    <line x1="505" y1="140" x2="556" y2="140" stroke="#555" stroke-width="1.5" marker-end="url(#seta)"/>
    <text x="531" y="132" font-size="10.5">3 vectors</text>

    <rect x="560" y="45" width="180" height="190" rx="4" fill="#fafafa" stroke="#ddd"/>
    <text x="730" y="228" font-size="10" fill="#999" text-anchor="end">vector space</text>
    <circle cx="595" cy="190" r="6" fill="#555"/>
    <text x="595" y="212" font-size="10.5">chunk 1</text>
    <circle cx="625" cy="125" r="6" fill="#555"/>
    <text x="625" y="147" font-size="10.5">chunk 3</text>
    <line x1="690" y1="92" x2="712" y2="68" stroke="#0085A1" stroke-width="2"/>
    <circle cx="690" cy="92" r="6" fill="#555"/>
    <text x="690" y="114" font-size="10.5">chunk 2</text>
    <circle cx="712" cy="68" r="6" fill="#0085A1"/>
    <text x="712" y="56" font-size="11" fill="#0085A1" font-weight="700">question</text>
    <text x="668" y="72" font-size="11" fill="#0085A1" text-anchor="end">near</text>

    <text x="567" y="275" font-size="12">the ticket counts by the chunk closest to the question</text>
  </g>
</svg>
