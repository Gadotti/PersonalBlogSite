name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # As ferramentas de teste (cheerio/linkinator, devDependencies) exigem
          # Node mais novo que o 18 do Netlify (netlify.toml) - o "hexo generate"
          # em si e puro JS e nao e sensivel a versao do Node, entao essa diferenca
          # nao afeta o que realmente vai para producao.
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm test
