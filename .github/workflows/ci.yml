name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Mesma versao de Node usada pelo build do Netlify (netlify.toml),
          # para que o resultado do CI reflita o que realmente vai para producao.
          node-version: '18'
          cache: 'npm'

      - run: npm ci
      - run: npm test
